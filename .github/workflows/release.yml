name: Release merged work

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run coverage
      - run: npm run format:check
      - name: Calculate release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-workflow.mjs calculate
      - name: Publish release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/release-workflow.mjs publish
