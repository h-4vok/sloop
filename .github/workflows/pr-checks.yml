name: PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr-checks:
    name: pr-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run PR checks
        run: npm run pr-checks
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
      - name: Build
        run: npm run build
